<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album Three - Memories</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Playfair+Display:ital,wght@0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #231338;
      background-image: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, 0.03) 0px,
        rgba(255, 255, 255, 0.03) 50px,
        transparent 50px,
        transparent 100px
      );
      padding: 50px 20px 80px 20px;
      user-select: none;
    }

    .album-wrapper {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    .album-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .album-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(2.5rem, 5vw, 4rem);
      color: #f3e8ff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .album-subtitle {
      font-family: 'Caveat', cursive;
      font-size: 1.5rem;
      color: #d8b4fe;
    }

    /* POLAROID GRID LAYOUT */
    .polaroid-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 30px;
      padding: 20px 0;
    }

    .polaroid-card {
      background: #fdfbf7;
      padding: 12px 12px 20px 12px;
      border-radius: 4px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
      position: relative;
    }

    .polaroid-card:nth-child(even) {
      transform: rotate(1.5deg);
    }

    .polaroid-card:nth-child(3n) {
      transform: rotate(-1.5deg);
    }

    .polaroid-card:nth-child(5n) {
      transform: rotate(0.8deg);
    }

    .polaroid-card:hover {
      transform: translateY(-8px) scale(1.03) rotate(0deg) !important;
      box-shadow: 0 25px 50px rgba(168, 85, 247, 0.4);
      z-index: 10;
    }

    .polaroid-img-container {
      width: 100%;
      height: 240px;
      overflow: hidden;
      background: #eee;
      border-radius: 2px;
    }

    .polaroid-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .polaroid-card:hover .polaroid-img {
      transform: scale(1.05);
    }

    .polaroid-caption {
      font-family: 'Caveat', cursive;
      font-size: 1.35rem;
      color: #2a133d;
      text-align: center;
      margin-top: 14px;
      line-height: 1;
    }

    /* BACK TO LETTER BUTTON SA PINAKABABA */
    .footer-action {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .back-btn {
      background: rgba(42, 19, 61, 0.85);
      color: #f3e8ff;
      border: 1.5px solid rgba(216, 180, 254, 0.4);
      padding: 14px 32px;
      border-radius: 35px;
      font-size: 1rem;
      font-weight: 500;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .back-btn:hover {
      background: rgba(69, 21, 102, 0.95);
      border-color: rgba(216, 180, 254, 0.8);
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(168, 85, 247, 0.3);
    }

    /* LIGHTBOX MODAL */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(15, 6, 26, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-content {
      position: relative;
      max-width: 90%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      background: #fdfbf7;
      padding: 16px 16px 24px 16px;
      border-radius: 6px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 72vh;
      object-fit: contain;
      border-radius: 2px;
    }

    .lightbox-caption {
      font-family: 'Caveat', cursive;
      font-size: 1.6rem;
      color: #2a133d;
      text-align: center;
    }

    .lightbox-close {
      position: absolute;
      top: -45px;
      right: 0;
      background: transparent;
      border: none;
      color: #f3e8ff;
      font-size: 2.2rem;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .lightbox-close:hover {
      color: #f472b6;
    }
  </style>
</head>
<body>

  <div class="album-wrapper">
    <div class="album-header">
      <h1 class="album-title">Album Three</h1>
      <p class="album-subtitle">Unforgettable Moments</p>
    </div>

    <!-- POLAROID GRID CONTAINER -->
    <div class="polaroid-grid" id="albumGrid">
      <!-- JavaScript will populate 128 polaroids here automatically -->
    </div>

    <!-- BACK TO LETTER BUTTON SA PINAKABABA -->
    <div class="footer-action">
      <a href="letter.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Letter</a>
    </div>
  </div>

  <!-- LIGHTBOX MODAL CONTAINER -->
  <div class="lightbox" id="lightboxModal" onclick="closeLightbox()">
    <div class="lightbox-content" onclick="event.stopPropagation()">
      <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
      <img src="" class="lightbox-img" id="lightboxImg" alt="Enlarged Memory">
      <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>
  </div>

  <script>
    // Automatically generate 128 polaroids for album3
    const gridContainer = document.getElementById('albumGrid');
    const totalPhotos = 128;

    for (let i = 1; i <= totalPhotos; i++) {
      const card = document.createElement('div');
      card.className = 'polaroid-card';
      card.setAttribute('onclick', `openLightbox('images/album3/photo${i}.jpeg', 'Memory ${i}')`);
      
      card.innerHTML = `
        <div class="polaroid-img-container">
          <img src="images/album3/photo${i}.jpeg" class="polaroid-img" alt="Memory ${i}">
        </div>
        <div class="polaroid-caption">Memory ${i}</div>
      `;
      
      gridContainer.appendChild(card);
    }

    function openLightbox(imgSrc, captionText) {
      const modal = document.getElementById('lightboxModal');
      const img = document.getElementById('lightboxImg');
      const caption = document.getElementById('lightboxCaption');

      img.src = imgSrc;
      caption.textContent = captionText;
      modal.classList.add('active');
    }

    function closeLightbox() {
      const modal = document.getElementById('lightboxModal');
      modal.classList.remove('active');
    }
  </script>

</body>
</html>
